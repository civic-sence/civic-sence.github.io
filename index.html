@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root {
    --green: #42ed91;
    --green-dark: #2bc97a;
    --yellow: #eee642;
    --purple: #6d42ed;
    --black: #0c0c0c;
    --dark: #121212;
    --gray: #1a1a1a;
    --white: #ffffff;
    --text-muted: rgba(255,255,255,0.65);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scrollbar-color: #3b82f6 #f1f5f9; scrollbar-width: auto; }
  html::-webkit-scrollbar { width: 12px; height: 12px; }
  html::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 100vw; }
  html::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 100vw; border: 3px solid #f1f5f9; }
  html::-webkit-scrollbar-thumb:hover { background: #2563eb; }
  body, .root-wrap {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  .nav {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 1200px;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 10px 20px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 999px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.12);
  }
  .logo {
    font-weight: 900;
    font-size: 1.35rem;
    letter-spacing: -0.03em;
    color: #111;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .logo span {
    background: var(--yellow);
    color: #111;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.95em;
  }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a {
    color: #333;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: #000; }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn-dark { background: #111; color: #fff; }
  .btn-dark:hover { background: #000; transform: translateY(-1px); }
  .btn-green { background: var(--green); color: #111; }
  .btn-green:hover { background: var(--green-dark); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: #111; border: 1.5px solid #ddd; }
  .btn-outline:hover { border-color: #111; }

  /* --- SPECIALLY HIGHLIGHTED HIRING BUTTON --- */
  .btn-hiring {
    background: #eee642;
    background: var(--yellow);
    color: #111;
    font-weight: 800;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 0 0 0 rgba(238,230,66,0.7);
    animation: hiringPulse 2s infinite;
    border: 1.5px solid #111;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  .btn-hiring::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border-radius: 999px;
    background: transparent;
    border: 2px solid #111;
    pointer-events: none;
    z-index: -1;
  }
  .btn-hiring::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: shine 3s infinite;
    z-index: 1;
  }
  @keyframes hiringPulse {
    0% { box-shadow: 0 0 0 0 rgba(238,230,66,0.7); transform: scale(1); }
    70% { box-shadow: 0 0 0 12px rgba(238,230,66,0); transform: scale(1.03); }
    100% { box-shadow: 0 0 0 0 rgba(238,230,66,0); transform: scale(1); }
  }
  @keyframes shine {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
  }
  .btn-hiring:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 20px rgba(238,230,66,0.55);
    animation: none;
  }
  .btn-hiring .dot-pulse {
    width: 8px; height: 8px; background: #111; border-radius: 50%;
    display: inline-block; margin-right: 2px;
    box-shadow: 0 0 0 0 rgba(17,17,17,0.7);
    animation: dotPulse 1.5s infinite;
  }
  @keyframes dotPulse {
    0% { box-shadow: 0 0 0 0 rgba(17,17,17,0.7); }
    70% { box-shadow: 0 0 0 6px rgba(17,17,17,0); }
    100% { box-shadow: 0 0 0 0 rgba(17,17,17,0); }
  }

  /* HERO */
  .hero {
    position: relative;
    min-height: 100svh;
    background: var(--green);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 24px 80px;
  }
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 10; text-align: center; max-width: 780px; }
  .hero-eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(0,0,0,0.55); margin-bottom: 18px; }
  .hero-title { font-size: clamp(3.2rem, 9vw, 6.5rem); font-weight: 900; line-height: 0.92; letter-spacing: -0.04em; color: #111; margin-bottom: 8px; }
  .hero-title .highlight { display: inline-block; background: #111; color: #fff; padding: 0.05em 0.22em 0.12em; border-radius: 12px; margin-top: 4px; }
  .hero-sub { font-size: clamp(1rem, 2.2vw, 1.25rem); color: rgba(0,0,0,0.65); max-width: 420px; margin: 28px auto 36px; line-height: 1.5; font-weight: 500; }
  .float-card {
    position: absolute;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s;
    cursor: pointer;
    z-index: 5;
    animation: float 6s ease-in-out infinite;
  }
  .float-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .float-card:hover { transform: scale(1.06) !important; box-shadow: 0 20px 50px rgba(0,0,0,0.28); z-index: 20; }
  .float-card .label {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.75); color: #fff; font-size: 0.7rem; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; opacity: 0; transform: translateY(6px);
    transition: all 0.25s ease; pointer-events: none;
  }
  .float-card:hover .label { opacity: 1; transform: translateY(0); }
  .fc-1 { width: 210px; height: 260px; top: 14%; left: 5%; animation-delay: 0s; }
  .fc-2 { width: 150px; height: 150px; top: 58%; left: 10%; animation-delay: 1.2s; }
  .fc-3 { width: 170px; height: 170px; top: 16%; right: 6%; animation-delay: 0.6s; }
  .fc-4 { width: 190px; height: 150px; top: 55%; right: 8%; animation-delay: 1.8s; }

  .marquee-wrap { position: absolute; bottom: 0; left: 0; width: 100%; height: 56px; background: #111; overflow: hidden; z-index: 15; }
  .marquee { display: flex; width: max-content; animation: marquee 28s linear infinite; height: 100%; align-items: center; }
  .marquee span { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.04em; color: #fff; padding: 0 28px; white-space: nowrap; display: flex; align-items: center; gap: 28px; }
  .marquee .dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; display: inline-block; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  section { position: relative; padding: 100px 24px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .section-title { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 16px; }
  .section-sub { font-size: 1.1rem; color: var(--text-muted); max-width: 480px; line-height: 1.55; }

  .come-section { background: var(--dark); text-align: center; padding: 120px 24px; }
  .come-section h2 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 700; margin-bottom: 8px; }
  .come-section p { color: var(--text-muted); font-size: 1.15rem; margin-bottom: 32px; }

  .social-section {
    background: var(--purple); padding: 100px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; max-width: 1200px; margin: 0 auto; border-radius: 0;
  }
  .social-section .left h2 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 20px; }
  .social-section .left h2 span { color: var(--yellow); }
  .social-section .left p { color: rgba(255,255,255,0.8); font-size: 1.05rem; line-height: 1.6; margin-bottom: 24px; }
  .feature-list { list-style: none; margin-top: 28px; }
  .feature-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 0.95rem; font-weight: 500; color: rgba(255,255,255,0.9); }
  .feature-list .num { background: rgba(0,0,0,0.25); width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
  .post-mock { background: #fff; border-radius: 16px; padding: 20px; color: #111; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .post-mock .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .post-mock .avatar { width: 36px; height: 36px; border-radius: 50%; background: #eee; object-fit: cover; }
  .post-mock .name { font-weight: 700; font-size: 0.9rem; }
  .post-mock .handle { font-size: 0.8rem; color: #888; }
  .post-mock .body { font-size: 0.95rem; line-height: 1.5; margin-bottom: 16px; }
  .post-mock .actions { display: flex; gap: 16px; font-size: 0.8rem; color: #666; }

  .make-section { background: var(--dark); padding: 120px 24px; }
  .make-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; align-items: center; }
  .profile-card { background: #1c1c1c; border-radius: 20px; overflow: hidden; border: 1px solid #2a2a2a; }
  .profile-card .cover { height: 120px; background: linear-gradient(135deg, #42ed91, #6d42ed); }
  .profile-card .info { padding: 0 24px 24px; margin-top: -40px; }
  .profile-card .avatar-lg { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #1c1c1c; object-fit: cover; background: #333; }
  .profile-card h3 { font-size: 1.3rem; margin: 12px 0 4px; }
  .profile-card .role { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }
  .profile-card .stats { display: flex; gap: 24px; font-size: 0.85rem; }
  .profile-card .stats strong { display: block; font-size: 1.1rem; }

  .gallery-section { background: var(--dark); padding: 80px 24px 120px; }
  .gallery-header { text-align: center; margin-bottom: 48px; }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .gallery-card { background: #1a1a1a; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a2a; transition: transform 0.3s, box-shadow 0.3s; }
  .gallery-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
  .gallery-card img { width: 100%; height: 180px; object-fit: cover; }
  .gallery-card .meta { padding: 14px 16px; }
  .gallery-card .meta h4 { font-size: 0.95rem; margin-bottom: 4px; }
  .gallery-card .meta span { font-size: 0.8rem; color: var(--text-muted); }

  .directory-section { background: #0a0a0a; padding: 100px 24px; }
  .people-stack { display: flex; flex-direction: column; gap: 12px; max-width: 420px; margin-left: auto; }
  .person-card { display: flex; align-items: center; gap: 14px; background: #1a1a1a; padding: 14px 18px; border-radius: 14px; border: 1px solid #2a2a2a; transition: transform 0.25s; }
  .person-card:hover { transform: translateX(-8px); }
  .person-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .person-card .name { font-weight: 700; font-size: 0.95rem; }
  .person-card .title { font-size: 0.8rem; color: var(--text-muted); }
  .badge { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--green); color: #111; margin-left: 6px; }

  .studio-section { background: #f5f5f5; color: #111; padding: 100px 24px; }
  .studio-section .section-sub { color: #555; }
  .logo-cloud { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 40px; }
  .logo-item { width: 70px; height: 70px; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; box-shadow: 0 4px 16px rgba(0,0,0,0.06); transition: transform 0.25s; }
  .logo-item:hover { transform: scale(1.08); }

  .testimonial-section { background: var(--yellow); color: #111; text-align: center; padding: 100px 24px; }
  .testimonial-section h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; margin-bottom: 32px; }
  .quote { font-size: 1.25rem; max-width: 560px; margin: 0 auto 24px; line-height: 1.5; font-weight: 500; }
  .quote-author { font-weight: 700; margin-top: 20px; }
  .quote-role { font-size: 0.9rem; color: #555; }

  .pricing-section { background: var(--dark); padding: 100px 24px; text-align: center; }
  .pricing-section h2 { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; margin-bottom: 12px; }
  .pricing-section > p { color: var(--text-muted); margin-bottom: 48px; max-width: 480px; margin-left: auto; margin-right: auto; }
  .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 960px; margin: 0 auto; }
  .price-card { border-radius: 20px; padding: 32px 28px; text-align: left; border: 1px solid #2a2a2a; }
  .price-card.free { background: #1a1a1a; }
  .price-card.pro { background: var(--purple); border-color: transparent; }
  .price-card.lifetime { background: var(--yellow); color: #111; border-color: transparent; }
  .price-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  .price-card .price { font-size: 2.4rem; font-weight: 900; margin-bottom: 8px; }
  .price-card .price span { font-size: 0.95rem; font-weight: 500; }
  .price-card .desc { font-size: 0.9rem; opacity: 0.8; margin-bottom: 24px; line-height: 1.45; }
  .price-card ul { list-style: none; margin-bottom: 28px; }
  .price-card li { font-size: 0.9rem; padding: 6px 0; display: flex; align-items: center; gap: 8px; }
  .price-card li::before { content: "✓"; font-weight: 700; }
  .price-card .btn { width: 100%; justify-content: center; }

  .faq-section { background: var(--dark); padding: 60px 24px 100px; }
  .faq-item { max-width: 640px; margin: 0 auto; border-bottom: 1px solid #2a2a2a; padding: 18px 0; }
  .faq-item summary { font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item p { margin-top: 12px; color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }

  .footer { background: #0a0a0a; padding: 80px 24px 40px; text-align: center; }
  .footer h2 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 700; margin-bottom: 28px; }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 32px; margin: 40px 0 24px; font-size: 0.9rem; }
  .footer-links a { color: var(--text-muted); text-decoration: none; }
  .footer-links a:hover { color: #fff; }
  .footer-social { display: flex; justify-content: center; gap: 16px; margin-bottom: 32px; }
  .footer-social a { width: 36px; height: 36px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; font-size: 0.9rem; }
  .footer-copy { font-size: 0.8rem; color: #555; }

  @media (max-width: 900px) {
    .nav-links { display: none; }
    .social-section { grid-template-columns: 1fr; }
    .make-grid { grid-template-columns: 1fr; }
    .pricing-grid { grid-template-columns: 1fr; max-width: 380px; }
    .fc-2, .fc-4 { display: none; }
    .directory-grid { grid-template-columns: 1fr !important; }
    .studio-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 600px) {
    .float-card { transform: scale(0.8); }
    .fc-1 { top: 18%; left: 4%; width: 140px; height: 170px; }
    .fc-3 { top: 20%; right: 4%; width: 120px; height: 120px; }
    .nav { padding: 8px 12px 8px 14px; top: 10px; width: calc(100% - 20px); }
    .btn-hiring { padding: 8px 14px; font-size: 0.8rem; }
    .nav-actions { gap: 6px; }
    .hero-actions { flex-direction: column; align-items: center; }
  }

  /* Ensure hiring button always visible on mobile nav */
  @media (max-width: 480px) {
    .nav-actions .btn-outline { display: none; }
    .btn-hiring { display: inline-flex !important; }
  }
