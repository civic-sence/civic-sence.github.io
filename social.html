<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — CIVICSENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --purple: #6d42ed;
    --yellow: #eee642;
    --green: #42ed91;
    --dark: #0a0a0a;
    --panel: #141414;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== TOP NAV ========== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--purple);
  }

  .logo {
    font-weight: 900;
    font-size: 1.15rem;
    letter-spacing: -0.03em;
    color: #111;
    text-decoration: none;
    background: var(--yellow);
    padding: 4px 10px;
    border-radius: 8px;
  }

  .nav-links {
    display: flex;
    gap: 22px;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.92);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .nav-links a:hover,
  .nav-links a.active { color: #fff; }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-pro {
    background: #111;
    color: #fff;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.04em;
  }

  .nav-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .nav-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.75rem;
    color: #111;
    text-decoration: none;
  }

  /* ========== SUB TABS ========== */
  .sub-tabs {
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 18px 24px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .sub-tabs a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sub-tabs a:hover { color: #fff; }
  .sub-tabs a.active { color: var(--yellow); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  /* ========== MAIN LAYOUT ========== */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 200px;
    max-width: 1200px;
    margin: 0 auto;
    min-height: calc(100vh - 110px);
  }

  /* ========== LEFT SIDEBAR ========== */
  .sidebar {
    padding: 28px 16px 28px 24px;
  }

  .side-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .side-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    margin-bottom: 2px;
    transition: background 0.15s, color 0.15s;
  }

  .side-item:hover {
    background: rgba(255,255,255,0.04);
    color: #fff;
  }

  .side-item svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 0.88rem;
    cursor: pointer;
    margin-top: 8px;
  }

  .toggle-switch {
    width: 36px;
    height: 20px;
    background: #333;
    border-radius: 999px;
    position: relative;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
  }

  .btn-new-post {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 28px;
    width: 100%;
    padding: 12px;
    border: 1.5px solid #3a3a3a;
    border-radius: 999px;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .btn-new-post:hover {
    border-color: #fff;
    background: rgba(255,255,255,0.04);
  }

  /* ========== FEED ========== */
  .feed {
    padding: 24px 28px 60px;
    border-left: 1px solid rgba(255,255,255,0.05);
    border-right: 1px solid rgba(255,255,255,0.05);
  }

  /* Composer */
  .composer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 28px;
  }

  .composer textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    resize: none;
    min-height: 56px;
    line-height: 1.5;
  }

  .composer textarea::placeholder {
    color: rgba(255,255,255,0.35);
  }

  .composer-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .composer-icons {
    display: flex;
    gap: 6px;
  }

  .composer-icons button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .composer-icons button:hover {
    background: rgba(255,255,255,0.06);
    color: #fff;
  }

  .composer-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .char-count {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .btn-post {
    background: #3a3a3a;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 20px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-post:hover { background: #4a4a4a; }
  .btn-post:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Post card */
  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .post-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .post-avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: #222;
  }

  .post-meta {
    flex: 1;
    min-width: 0;
  }

  .post-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .post-name {
    font-weight: 700;
    font-size: 0.95rem;
  }

  .badge {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .badge-ok { background: rgba(109,66,237,0.25); color: #b8a0ff; }
  .badge-pro { background: rgba(66,237,145,0.2); color: var(--green); }
  .badge-biz { background: rgba(238,230,66,0.2); color: var(--yellow); }

  .post-handle {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .post-role {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .post-time {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .post-body {
    font-size: 0.95rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.9);
    margin-bottom: 14px;
  }

  .post-body p + p { margin-top: 10px; }

  .post-media {
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #5a3dcf, #3a2a8a);
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .post-media img {
    width: 100%;
    display: block;
  }

  .post-actions {
    display: flex;
    gap: 18px;
    padding-top: 4px;
  }

  .post-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
  }

  .post-actions button:hover { color: #fff; }

  /* ========== RIGHT RAIL ========== */
  .rail {
    padding: 28px 20px;
  }

  .feedback-box {
    text-align: right;
  }

  .feedback-box h3 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .btn-contact {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid #3a3a3a;
    border-radius: 999px;
    padding: 10px 18px;
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: border-color 0.2s;
  }

  .btn-contact:hover { border-color: #fff; }

  /* Empty / loading */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 200px 1fr; }
    .rail { display: none; }
  }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .side-title, .theme-toggle { display: none; }
    .btn-new-post { width: auto; margin: 0; padding: 8px 16px; }
    .feed { padding: 16px; border: none; }
    .nav-links { display: none; }
    .sub-tabs { gap: 14px; overflow-x: auto; justify-content: flex-start; padding-left: 16px; }
  }
</style>

<script>
  const SUPABASE_URL = 'https://upmlijvwbzctaglsrcfu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwbWxpanZ3YnpjdGFnbHNyY2Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MjA1NDcsImV4cCI6MjEwNjM5NjU0N30.-hIK_WXzbbW55WQ5KrWZPiHRQwhpE9850VCHbmr8PcM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const textarea = document.getElementById('post-text');
  const postBtn = document.getElementById('post-btn');
  const charCount = document.getElementById('char-count');
  const postsList = document.getElementById('posts-list');
  const emptyState = document.getElementById('empty-state');
  const navAvatar = document.querySelector('.nav-avatar');
  const MAX = 1000;
  let currentUser = null;
  let currentProfile = null;

  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatTime(iso) {
    if (!iso) return 'Just now';
    const d = new Date(iso);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const day = d.getDate();
    const suffix = day === 1 || day === 21 || day === 31 ? 'st' : day === 2 || day === 22 ? 'nd' : day === 3 || day === 23 ? 'rd' : 'th';
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return months[d.getMonth()] + ' ' + day + suffix + '<br>' + time;
  }

  function hideEmpty() {
    if (emptyState) emptyState.style.display = 'none';
  }
  function showEmpty() {
    if (emptyState) emptyState.style.display = 'block';
  }

  function initials(name) {
    if (!name) return 'CS';
    return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  function renderPost({ name, handle, body, time, avatar_url, is_business, role }) {
    const article = document.createElement('article');
    article.className = 'post';
    const avatarHtml = avatar_url
      ? `<img class="post-avatar" src="${escapeHtml(avatar_url)}" alt="">`
      : `<div class="post-avatar" style="background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:0.85rem;">${escapeHtml(initials(name))}</div>`;
    const badges = is_business ? '<span class="badge badge-biz">BUSINESS</span>' : '<span class="badge badge-ok">HELPER</span>';
    article.innerHTML = `
      <div class="post-header">
        ${avatarHtml}
        <div class="post-meta">
          <div class="post-name-row">
            <span class="post-name">${escapeHtml(name || 'Member')}</span>
            ${badges}
            <span class="post-handle">@${escapeHtml(handle || 'user')}</span>
          </div>
          ${role ? `<div class="post-role">${escapeHtml(role)}</div>` : ''}
        </div>
        <span class="post-time">${time || 'Just now'}</span>
      </div>
      <div class="post-body"><p>${escapeHtml(body)}</p></div>
      <div class="post-actions">
        <button type="button" class="act-like">♡ 0</button>
        <button type="button">💬 0</button>
        <button type="button">↗ Share</button>
        <button type="button">🔖</button>
      </div>`;
    postsList.appendChild(article);
    hideEmpty();
  }

  async function loadAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    currentUser = session?.user || null;
    if (currentUser) {
      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .maybeSingle();
      currentProfile = profile;
      if (navAvatar) {
        const label = profile?.username || profile?.full_name || currentUser.email || 'CS';
        navAvatar.textContent = initials(label);
        navAvatar.title = profile?.full_name || profile?.username || currentUser.email;
        navAvatar.href = profile?.is_business ? 'business-profile.html' : 'business-profile.html';
      }
    } else if (navAvatar) {
      navAvatar.textContent = '?';
      navAvatar.href = 'login.html';
      navAvatar.title = 'Log in';
    }
  }

  async function loadPosts() {
    postsList.innerHTML = '';
    const { data, error } = await supabase
      .from('posts')
      .select('id, body, created_at, user_id, profiles:user_id ( username, full_name, avatar_url, is_business )')
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) {
      console.error(error);
      // Fallback without join if FK not set
      const { data: plain } = await supabase
        .from('posts')
        .select('id, body, created_at, user_id')
        .order('created_at', { ascending: false })
        .limit(50);
      if (!plain || plain.length === 0) { showEmpty(); return; }
      for (const p of plain) {
        let name = 'Member', handle = 'member', avatar = null, isBiz = false;
        const { data: prof } = await supabase.from('profiles').select('*').eq('id', p.user_id).maybeSingle();
        if (prof) {
          name = prof.full_name || prof.username || name;
          handle = prof.username || handle;
          avatar = prof.avatar_url;
          isBiz = !!prof.is_business;
        }
        renderPost({ name, handle, body: p.body, time: formatTime(p.created_at), avatar_url: avatar, is_business: isBiz });
      }
      return;
    }

    if (!data || data.length === 0) { showEmpty(); return; }
    data.forEach(p => {
      const prof = p.profiles || {};
      renderPost({
        name: prof.full_name || prof.username || 'Member',
        handle: prof.username || 'member',
        body: p.body,
        time: formatTime(p.created_at),
        avatar_url: prof.avatar_url,
        is_business: prof.is_business
      });
    });
  }

  textarea.addEventListener('input', () => {
    const left = MAX - textarea.value.length;
    charCount.textContent = left > 100 ? '1k' : String(left);
    postBtn.disabled = textarea.value.trim().length === 0;
  });

  document.getElementById('focus-composer').addEventListener('click', () => {
    if (!currentUser) {
      window.location.href = 'login.html';
      return;
    }
    textarea.focus();
    document.getElementById('composer').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  postBtn.addEventListener('click', async () => {
    const text = textarea.value.trim();
    if (!text) return;

    if (!currentUser) {
      alert('Please log in to post.');
      window.location.href = 'login.html';
      return;
    }

    postBtn.disabled = true;
    postBtn.textContent = 'POSTING…';

    try {
      const { error } = await supabase.from('posts').insert({
        user_id: currentUser.id,
        body: text
      });
      if (error) throw error;

      // Prepend new post at top
      const temp = document.createElement('div');
      postsList.insertBefore(temp, postsList.firstChild);
      const name = currentProfile?.full_name || currentProfile?.username || 'You';
      const handle = currentProfile?.username || 'you';
      const article = document.createElement('article');
      article.className = 'post';
      const av = currentProfile?.avatar_url
        ? `<img class="post-avatar" src="${escapeHtml(currentProfile.avatar_url)}" alt="">`
        : `<div class="post-avatar" style="background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:0.85rem;">${escapeHtml(initials(name))}</div>`;
      article.innerHTML = `
        <div class="post-header">
          ${av}
          <div class="post-meta">
            <div class="post-name-row">
              <span class="post-name">${escapeHtml(name)}</span>
              ${currentProfile?.is_business ? '<span class="badge badge-biz">BUSINESS</span>' : '<span class="badge badge-ok">HELPER</span>'}
              <span class="post-handle">@${escapeHtml(handle)}</span>
            </div>
          </div>
          <span class="post-time">Just now</span>
        </div>
        <div class="post-body"><p>${escapeHtml(text)}</p></div>
        <div class="post-actions">
          <button type="button">♡ 0</button>
          <button type="button">💬 0</button>
          <button type="button">↗ Share</button>
          <button type="button">🔖</button>
        </div>`;
      postsList.replaceChild(article, temp);
      hideEmpty();
      textarea.value = '';
      postBtn.disabled = true;
      charCount.textContent = '1k';
    } catch (err) {
      console.error(err);
      alert(err.message || 'Could not post. Make sure you ran supabase-schema.sql.');
    } finally {
      postBtn.textContent = 'POST';
    }
  });

  // Realtime: new posts
  supabase
    .channel('posts-feed')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, async (payload) => {
      if (payload.new.user_id === currentUser?.id) return; // already shown optimistically
      const { data: prof } = await supabase.from('profiles').select('*').eq('id', payload.new.user_id).maybeSingle();
      const article = document.createElement('article');
      // reuse render by prepending
      const holder = document.createElement('div');
      postsList.insertBefore(holder, postsList.firstChild);
      renderPost({
        name: prof?.full_name || prof?.username || 'Member',
        handle: prof?.username || 'member',
        body: payload.new.body,
        time: 'Just now',
        avatar_url: prof?.avatar_url,
        is_business: prof?.is_business
      });
      // move last rendered to top
      const last = postsList.lastElementChild;
      if (last && holder.parentNode) {
        postsList.insertBefore(last, holder);
        holder.remove();
      }
    })
    .subscribe();

  (async () => {
    await loadAuth();
    await loadPosts();
  })();
</script>
</body>
</html>
